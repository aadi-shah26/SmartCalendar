<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scheduler Viewer</title>
  <script src="test_outputs/cpsat_output.js"></script>
  <script src="test_outputs/heuristic_output.js"></script>
  <style>
    :root {
      --bg:           #f1f5f9;
      --sidebar-bg:   #0f172a;
      --card:         #ffffff;
      --border:       #e2e8f0;
      --text:         #1e293b;
      --muted:        #64748b;

      --critical:     #dc2626;
      --critical-bg:  #fef2f2;
      --high:         #ea580c;
      --high-bg:      #fff7ed;
      --medium:       #2563eb;
      --medium-bg:    #eff6ff;
      --low:          #64748b;
      --low-bg:       #f8fafc;

      --required:     #7c3aed;
      --required-bg:  #f5f3ff;
      --optional:     #64748b;
      --optional-bg:  #f1f5f9;

      --green:  #16a34a;
      --yellow: #d97706;
      --red:    #dc2626;

      --cpsat:     #0ea5e9;
      --heuristic: #a855f7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #sidebar-header {
      padding: 18px 14px 14px;
      border-bottom: 1px solid #1e293b;
    }
    #sidebar-header h1 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f1f5f9;
    }
    #sidebar-header p {
      font-size: 10px;
      color: #475569;
      margin-top: 4px;
    }

    /* mode tabs in sidebar */
    #mode-tabs {
      display: flex;
      padding: 8px 10px 2px;
      gap: 4px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      background: rgba(255,255,255,0.02);
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, color 0.12s;
    }
    .mode-tab:hover { background: rgba(255,255,255,0.05); color: #cbd5e1; }
    .mode-tab.active { color: #f1f5f9; background: rgba(59,130,246,0.2); border-color: #3b82f6; }

    .sc-item {
      padding: 10px 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.12s;
    }
    .sc-item:hover { background: rgba(255,255,255,0.04); }
    .sc-item.active {
      background: rgba(37,99,235,0.18);
      border-left-color: #3b82f6;
    }
    .sc-item .sc-name {
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .sc-item.active .sc-name { color: #93c5fd; }
    .sc-item .sc-meta {
      font-size: 10px;
      color: #475569;
      margin-top: 3px;
    }
    .sc-item .sc-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .sc-badge.ok       { background: #14532d; color: #86efac; }
    .sc-badge.partial  { background: #78350f; color: #fde68a; }
    .sc-badge.missing  { background: #7f1d1d; color: #fca5a5; }

    /* ── Main ────────────────────────────────────────────── */
    #main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    /* ── Nav bar ─────────────────────────────────────────── */
    #nav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .nav-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--card);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .nav-btn:hover { background: var(--bg); color: var(--text); }
    #nav-title {
      flex: 1;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #nav-ctr { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .scheduler-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-left: 8px;
      vertical-align: middle;
    }
    .scheduler-pill.cpsat     { background: #e0f2fe; color: var(--cpsat); }
    .scheduler-pill.heuristic { background: #f3e8ff; color: var(--heuristic); }
    .scheduler-pill.compare   { background: #f1f5f9; color: var(--muted); }

    /* ── Display options ─────────────────────────────────── */
    #opts {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    #opts strong { color: var(--text); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .opt { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .opt input { cursor: pointer; accent-color: #3b82f6; }

    /* ── Cards ───────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Horizon card ────────────────────────────────────── */
    .horizon-chips {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .chip { display: flex; flex-direction: column; gap: 2px; }
    .chip .cl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .chip .cv { font-size: 15px; font-weight: 600; }

    .cap-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .cap-badge.fits-all      { background: #dcfce7; color: #166534; }
    .cap-badge.fits-required { background: #fef9c3; color: #854d0e; }
    .cap-badge.over-capacity { background: #fee2e2; color: #991b1b; }

    /* ── Badges ──────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .badge.critical { background: var(--critical-bg); color: var(--critical); }
    .badge.high     { background: var(--high-bg);     color: var(--high); }
    .badge.medium   { background: var(--medium-bg);   color: var(--medium); }
    .badge.low      { background: var(--low-bg);      color: var(--low); border: 1px solid var(--border); }
    .badge.required { background: var(--required-bg); color: var(--required); }
    .badge.optional { background: var(--optional-bg); color: var(--optional); }

    /* ── Tables ──────────────────────────────────────────── */
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th {
      text-align: left;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .tbl td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: #fafafa; }
    .tbl tr.row-skip  td { opacity: 0.45; }
    .tbl tr.row-missing td { background: #fef2f2 !important; }
    .tbl tr.row-diff td { background: #fffbeb !important; }

    .pill {
      display: inline-block;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      background: #f1f5f9;
      color: var(--muted);
      margin-left: 3px;
      vertical-align: middle;
    }

    /* ── Timeline ────────────────────────────────────────── */
    .tl-wrap { margin-top: 4px; }
    .tl-labels {
      position: relative;
      height: 18px;
      margin-bottom: 4px;
    }
    .tl-label {
      position: absolute;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      pointer-events: none;
    }
    .tl-track {
      position: relative;
      height: 38px;
      background: #f1f5f9;
      border-radius: 6px;
      overflow: visible;
    }
    .tl-rule {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: #cbd5e1;
      pointer-events: none;
    }
    .tl-pref {
      position: absolute;
      top: 0; bottom: 0;
      border-radius: 4px;
      opacity: 0.18;
      pointer-events: none;
    }
    .tl-block {
      position: absolute;
      top: 4px; bottom: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 5px;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      white-space: nowrap;
      min-width: 3px;
      cursor: default;
      transition: filter 0.15s;
    }
    .tl-block:hover { filter: brightness(1.15); z-index: 5; }
    .tl-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .tl-legend span { display: flex; align-items: center; gap: 4px; }
    .tl-swatch {
      width: 10px; height: 10px;
      border-radius: 2px;
      display: inline-block;
      flex-shrink: 0;
    }

    .tl-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .tl-heading.cpsat     { color: var(--cpsat); }
    .tl-heading.heuristic { color: var(--heuristic); }
    .tl-heading-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .tl-heading.cpsat     .tl-heading-dot { background: var(--cpsat); }
    .tl-heading.heuristic .tl-heading-dot { background: var(--heuristic); }

    /* ── Stats row ───────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stat-box {
      flex: 1;
      min-width: 100px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      text-align: center;
    }
    .stat-box .sv {
      font-size: 21px;
      font-weight: 700;
    }
    .stat-box .sl {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 3px;
    }

    /* compare stat row */
    .cmp-stats {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: stretch;
    }
    .cmp-col {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .cmp-col-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .cmp-col.cpsat .cmp-col-title     { color: var(--cpsat); }
    .cmp-col.heuristic .cmp-col-title { color: var(--heuristic); }
    .cmp-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
    .cmp-row .cmp-k { color: var(--muted); }
    .cmp-row .cmp-v { font-weight: 600; font-variant-numeric: tabular-nums; }
    .cmp-vs {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .delta-better { color: var(--green); }
    .delta-worse  { color: var(--red); }
    .delta-same   { color: var(--muted); }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); line-height: 1.8; }
    .empty code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <h1>Scheduler Viewer</h1>
    <p id="gen-at">—</p>
  </div>
  <div id="mode-tabs">
    <div class="mode-tab active" data-mode="cpsat"     onclick="setMode('cpsat')">CP-SAT</div>
    <div class="mode-tab"        data-mode="heuristic" onclick="setMode('heuristic')">Greedy</div>
    <div class="mode-tab"        data-mode="compare"   onclick="setMode('compare')">Compare</div>
  </div>
  <div id="sc-list"></div>
</aside>

<main id="main">
  <div id="nav">
    <button class="nav-btn" id="btn-prev" title="Previous (Left arrow)" onclick="go(-1)">&#8249;</button>
    <div id="nav-title">—</div>
    <span id="nav-ctr">—</span>
    <button class="nav-btn" id="btn-next" title="Next (Right arrow)" onclick="go(1)">&#8250;</button>
  </div>

  <div id="opts">
    <strong>Display</strong>
    <label class="opt"><input type="checkbox" id="o-pref"    checked onchange="redraw()"> Preferred windows on timeline</label>
    <label class="opt"><input type="checkbox" id="o-skip"    checked onchange="redraw()"> Show skipped tasks</label>
    <label class="opt"><input type="checkbox" id="o-compact"         onchange="redraw()"> Compact task list</label>
  </div>

  <div id="content"></div>
</main>

<script>
/* ── State ─────────────────────────────────────────────── */
let idx = 0;
let mode = 'cpsat';    // 'cpsat' | 'heuristic' | 'compare'

const CPSAT     = typeof CPSAT_DATA     !== 'undefined' ? CPSAT_DATA     : null;
const HEURISTIC = typeof HEURISTIC_DATA !== 'undefined' ? HEURISTIC_DATA : null;

function activeData() {
  if (mode === 'cpsat')     return CPSAT;
  if (mode === 'heuristic') return HEURISTIC;
  // For compare view, sidebar needs a driver; prefer cpsat, fall back to heuristic
  return CPSAT || HEURISTIC;
}

function bothAvailable() { return CPSAT && HEURISTIC; }

/* ── Boot ──────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  if (!CPSAT && !HEURISTIC) {
    document.getElementById('content').innerHTML =
      `<div class="card empty">
        No scheduler output found.<br>
        Run <code>python test_cpsat.py</code> and/or <code>python test_heuristic.py</code> first,<br>
        then refresh this page.
      </div>`;
    return;
  }

  // Auto-pick a default mode that has data
  if (!CPSAT && HEURISTIC) mode = 'heuristic';

  updateModeTabs();
  updateGenAt();
  buildSidebar();
  render(0);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  go(-1);
  if (e.key === 'ArrowRight') go(1);
});

function go(dir) {
  const data = activeData();
  if (!data) return;
  const n = data.scenarios.length;
  render((idx + dir + n) % n);
}

/* ── Mode switching ─────────────────────────────────────── */
function setMode(m) {
  if (m === 'cpsat'     && !CPSAT)     { alert('No CP-SAT data loaded.'); return; }
  if (m === 'heuristic' && !HEURISTIC) { alert('No Heuristic data loaded.'); return; }
  if (m === 'compare'   && !bothAvailable()) {
    alert('Compare mode needs both CP-SAT and Heuristic outputs.'); return;
  }
  mode = m;
  updateModeTabs();
  updateGenAt();
  buildSidebar();
  render(idx);
}

function updateModeTabs() {
  document.querySelectorAll('.mode-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
}

function updateGenAt() {
  const el = document.getElementById('gen-at');
  if (mode === 'compare') {
    const c = CPSAT     ? CPSAT.generated_at     : '—';
    const h = HEURISTIC ? HEURISTIC.generated_at : '—';
    el.innerHTML = `CP-SAT: ${esc(c)}<br>Greedy: ${esc(h)}`;
  } else {
    const d = activeData();
    el.textContent = 'Generated ' + (d ? d.generated_at : '—');
  }
}

/* ── Sidebar ───────────────────────────────────────────── */
function buildSidebar() {
  const data = activeData();
  if (!data) { document.getElementById('sc-list').innerHTML = ''; return; }

  document.getElementById('sc-list').innerHTML =
    data.scenarios.map((s, i) => {
      let meta, badgeHtml;
      if (mode === 'compare') {
        const c = CPSAT.scenarios[i];
        const h = HEURISTIC.scenarios[i];
        meta = `${s.total_count} tasks`;
        const cp = c?.placed_count ?? 0, hp = h?.placed_count ?? 0;
        const cs = c?.total_score ?? 0,  hs = h?.total_score ?? 0;
        const placedDiff = cp - hp;
        const scoreDiff  = cs - hs;
        let cls = 'ok', lbl;
        if (placedDiff === 0 && Math.abs(scoreDiff) < 0.5) { cls = 'ok'; lbl = 'match'; }
        else if (placedDiff > 0 || scoreDiff > 0.5)        { cls = 'partial'; lbl = `cp-sat +${Math.max(placedDiff,0) || scoreDiff.toFixed(1)}`; }
        else                                               { cls = 'missing'; lbl = `greedy +${Math.max(-placedDiff,0) || (-scoreDiff).toFixed(1)}`; }
        badgeHtml = `<span class="sc-badge ${cls}">${esc(lbl)}</span>`;
      } else {
        const allPlaced = s.placed_count === s.total_count;
        const noMissing = s.unplaced_required.length === 0;
        const cls = !noMissing ? 'missing' : allPlaced ? 'ok' : 'partial';
        const lbl = !noMissing ? 'missing required'
                  : allPlaced  ? 'all placed'
                  : `${s.placed_count}/${s.total_count} placed`;
        meta = `${s.total_count} tasks · ${dur(s.horizon_minutes)}`;
        badgeHtml = `<span class="sc-badge ${cls}">${lbl}</span>`;
      }
      return `<div class="sc-item" onclick="render(${i})">
        <div class="sc-name">${esc(s.name)}</div>
        <div class="sc-meta">${meta}</div>
        ${badgeHtml}
      </div>`;
    }).join('');
}

/* ── Render ────────────────────────────────────────────── */
function render(i) {
  idx = i;
  const data = activeData();
  if (!data) return;
  const s = data.scenarios[i];
  const n = data.scenarios.length;

  const modeBadge = `<span class="scheduler-pill ${mode}">${modeLabel(mode)}</span>`;
  document.getElementById('nav-title').innerHTML = esc(s.name) + modeBadge;
  document.getElementById('nav-ctr').textContent = `${i + 1} / ${n}`;

  document.querySelectorAll('.sc-item').forEach((el, j) => {
    el.classList.toggle('active', j === i);
    if (j === i) el.scrollIntoView({ block: 'nearest' });
  });

  if (mode === 'compare') {
    document.getElementById('content').innerHTML = buildCompareContent(i);
  } else {
    document.getElementById('content').innerHTML = buildContent(s);
  }
}

function redraw() { render(idx); }

function modeLabel(m) {
  return { cpsat: 'CP-SAT', heuristic: 'Greedy', compare: 'Compare' }[m];
}

/* ── Single-scheduler view ─────────────────────────────── */
function buildContent(s) {
  return horizonCard(s) + inputCard(s) + timelineCard(s) + resultsCard(s) + statsCard(s);
}

/* ── Compare view ──────────────────────────────────────── */
function buildCompareContent(i) {
  const c = CPSAT.scenarios[i];
  const h = HEURISTIC.scenarios[i];
  // Horizon + input are shared (same scenario spec fed to both)
  return horizonCard(c)
       + inputCompareCard(c, h)
       + timelineCompareCard(c, h)
       + diffTableCard(c, h)
       + compareStatsCard(c, h);
}

/* ── Horizon card ──────────────────────────────────────── */
function horizonCard(s) {
  let capCls, capIcon, capMsg;
  if (s.fits_all) {
    capCls = 'fits-all'; capIcon = '&#10003;';
    capMsg = 'All tasks fit within this window.';
  } else if (s.fits_required) {
    const excess = s.total_task_minutes - s.horizon_minutes;
    capCls = 'fits-required'; capIcon = '&#9651;';
    capMsg = `Required tasks fit. ${dur(excess)} of optional work will be dropped.`;
  } else {
    const over = s.required_task_minutes - s.horizon_minutes;
    capCls = 'over-capacity'; capIcon = '&#9888;';
    capMsg = `Over capacity &mdash; required tasks alone exceed the window by ${dur(over)}.`;
  }
  return `<div class="card">
    <div class="card-title">Window</div>
    <div class="horizon-chips">
      <div class="chip"><span class="cl">From</span>    <span class="cv">${dt(s.horizon_start)}</span></div>
      <div class="chip"><span class="cl">To</span>      <span class="cv">${dt(s.horizon_end)}</span></div>
      <div class="chip"><span class="cl">Available</span><span class="cv">${dur(s.horizon_minutes)}</span></div>
      <div class="chip"><span class="cl">Total work</span><span class="cv">${dur(s.total_task_minutes)}</span></div>
      <div class="chip"><span class="cl">Required</span> <span class="cv">${dur(s.required_task_minutes)}</span></div>
      <div class="chip"><span class="cl">Optional</span> <span class="cv">${dur(s.optional_task_minutes)}</span></div>
    </div>
    <span class="cap-badge ${capCls}">${capIcon}&nbsp;${capMsg}</span>
  </div>`;
}

/* ── Input tasks card ──────────────────────────────────── */
function inputCard(s) {
  const compact = document.getElementById('o-compact').checked;

  if (compact) {
    const items = s.tasks.map(t => {
      const p = s.placements.find(x => x.name === t.name);
      const dim = p ? '' : 'opacity:0.45;';
      const tip = [t.name, dur(t.duration_minutes), t.priority, t.requirement,
        p ? `placed ${tm(p.start)}-${tm(p.end)}` : 'not placed'].join(' | ');
      return `<span style="${dim}display:inline-flex;align-items:center;gap:4px;margin:3px 4px;"
                    title="${esc(tip)}">
        <span class="badge ${t.priority}">${t.priority[0].toUpperCase()}</span>
        <span class="badge ${t.requirement}">${t.requirement === 'required' ? 'R' : 'O'}</span>
        <span style="font-size:12px;font-weight:500">${esc(t.name)}</span>
        <span style="font-size:11px;color:var(--muted)">${dur(t.duration_minutes)}</span>
      </span>`;
    }).join('');
    return `<div class="card"><div class="card-title">Tasks (${s.tasks.length})</div><div>${items}</div></div>`;
  }

  const rows = s.tasks.map(t => {
    const placed  = s.placements.find(x => x.name === t.name);
    const missing = !placed && t.requirement === 'required';
    const rowCls  = missing ? 'row-missing' : '';

    let notes = '';
    if (t.preferred_start) notes += `<span class="pill" title="Prefer ${dt(t.preferred_start)} - ${tm(t.preferred_end)}">pref</span>`;
    if (t.allowed_start)   notes += `<span class="pill" title="Allowed ${dt(t.allowed_start)} - ${dt(t.allowed_end)}">allowed</span>`;
    if (t.blackout_start)  notes += `<span class="pill" title="Blackout ${dt(t.blackout_start)} - ${tm(t.blackout_end)}">blackout</span>`;

    const resultHtml = placed
      ? `<span style="color:var(--green)">&#10003; ${tm(placed.start)} &ndash; ${tm(placed.end)}</span>`
      : t.requirement === 'required'
        ? `<span style="color:var(--red);font-weight:600">&#10007; unplaced</span>`
        : `<span style="color:var(--muted)">skipped</span>`;

    return `<tr class="${rowCls}">
      <td style="font-weight:500">${esc(t.name)}${notes}</td>
      <td>${dur(t.duration_minutes)}</td>
      <td><span class="badge ${t.priority}">${t.priority}</span></td>
      <td><span class="badge ${t.requirement}">${t.requirement}</span></td>
      <td>${resultHtml}</td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <div class="card-title">Input Tasks (${s.tasks.length})</div>
    <table class="tbl">
      <thead><tr>
        <th>Task</th><th>Duration</th><th>Priority</th><th>Requirement</th><th>Result</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

/* ── Input tasks card (compare) ────────────────────────── */
function inputCompareCard(c, h) {
  const rows = c.tasks.map(t => {
    const cp = c.placements.find(x => x.name === t.name);
    const hp = h.placements.find(x => x.name === t.name);

    const diff = placementDiffers(cp, hp);
    const rowCls = diff ? 'row-diff' : '';

    let notes = '';
    if (t.preferred_start) notes += `<span class="pill" title="Prefer ${dt(t.preferred_start)} - ${tm(t.preferred_end)}">pref</span>`;
    if (t.allowed_start)   notes += `<span class="pill" title="Allowed ${dt(t.allowed_start)} - ${dt(t.allowed_end)}">allowed</span>`;
    if (t.blackout_start)  notes += `<span class="pill" title="Blackout ${dt(t.blackout_start)} - ${tm(t.blackout_end)}">blackout</span>`;

    return `<tr class="${rowCls}">
      <td style="font-weight:500">${esc(t.name)}${notes}</td>
      <td>${dur(t.duration_minutes)}</td>
      <td><span class="badge ${t.priority}">${t.priority}</span></td>
      <td><span class="badge ${t.requirement}">${t.requirement}</span></td>
      <td>${resultCell(cp, t, 'cpsat')}</td>
      <td>${resultCell(hp, t, 'heuristic')}</td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <div class="card-title">Tasks (${c.tasks.length}) &mdash; highlighted rows differ</div>
    <table class="tbl">
      <thead><tr>
        <th>Task</th><th>Dur</th><th>Priority</th><th>Req</th>
        <th style="color:var(--cpsat)">CP-SAT</th>
        <th style="color:var(--heuristic)">Greedy</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function resultCell(p, t, schedulerTag) {
  if (p) return `<span style="color:var(--green)">&#10003; ${tm(p.start)}</span>`;
  if (t.requirement === 'required') return `<span style="color:var(--red);font-weight:600">&#10007; unplaced</span>`;
  return `<span style="color:var(--muted)">skipped</span>`;
}

function placementDiffers(a, b) {
  if (!a && !b) return false;
  if (!a || !b) return true;
  return a.start !== b.start;
}

/* ── Timeline card ─────────────────────────────────────── */
function timelineCard(s) {
  return `<div class="card">
    <div class="card-title">Timeline</div>
    ${renderTimeline(s)}
    ${renderTimelineLegend(true)}
  </div>`;
}

function timelineCompareCard(c, h) {
  const cpCount = c.placements.length;
  const hpCount = h.placements.length;
  return `<div class="card">
    <div class="card-title">Timelines</div>
    <div class="tl-heading cpsat">
      <span class="tl-heading-dot"></span>CP-SAT
      <span style="color:var(--muted);font-weight:500;margin-left:auto">${cpCount} placed · score ${c.total_score.toFixed(1)}</span>
    </div>
    ${renderTimeline(c)}
    <div style="height:14px"></div>
    <div class="tl-heading heuristic">
      <span class="tl-heading-dot"></span>Greedy
      <span style="color:var(--muted);font-weight:500;margin-left:auto">${hpCount} placed · score ${h.total_score.toFixed(1)}</span>
    </div>
    ${renderTimeline(h)}
    ${renderTimelineLegend(true)}
  </div>`;
}

function renderTimeline(s) {
  const showPref = document.getElementById('o-pref').checked;
  const hStart = new Date(s.horizon_start).getTime();
  const hEnd   = new Date(s.horizon_end).getTime();
  const span   = hEnd - hStart;

  function leftPct(ms)    { return ((ms - hStart) / span * 100).toFixed(3); }
  function widthPct(a, b) { return ((b - a) / span * 100).toFixed(3); }

  const hHours = span / 3_600_000;
  const step = hHours <= 12 ? 1 : hHours <= 24 ? 2 : hHours <= 72 ? 12 : 24;

  const markers = [];
  let cur = new Date(hStart);
  cur.setMinutes(0, 0, 0);
  if (step >= 24) cur.setHours(0);
  while (cur.getTime() <= hEnd) {
    const ms = cur.getTime();
    if (ms >= hStart && ms <= hEnd) {
      const p = leftPct(ms);
      const lbl = step >= 24
        ? cur.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
        : cur.toLocaleTimeString('en-US', { hour: 'numeric', hour12: true });
      markers.push({ p, lbl });
    }
    cur = new Date(cur.getTime() + step * 3_600_000);
  }

  const labelHtml = markers.map(m =>
    `<div class="tl-label" style="left:${m.p}%">${m.lbl}</div>`).join('');
  const ruleHtml = markers.map(m =>
    `<div class="tl-rule" style="left:${m.p}%"></div>`).join('');

  const prefHtml = showPref ? s.tasks.flatMap(t => {
    if (!t.preferred_start) return [];
    const ps = Math.max(new Date(t.preferred_start).getTime(), hStart);
    const pe = Math.min(new Date(t.preferred_end).getTime(),   hEnd);
    if (ps >= pe) return [];
    return [`<div class="tl-pref" style="left:${leftPct(ps)}%;width:${widthPct(ps,pe)}%;background:${pcolor(t.priority)}"
      title="Preferred window: ${esc(t.name)}"></div>`];
  }).join('') : '';

  const blocksHtml = s.placements.map(p => {
    const ps = new Date(p.start).getTime();
    const pe = new Date(p.end).getTime();
    const tip = `${p.name}\n${dt(p.start)} - ${tm(p.end)}\n${dur(p.duration_minutes)} | score: ${p.score}`;
    return `<div class="tl-block" style="left:${leftPct(ps)}%;width:${widthPct(ps,pe)}%;background:${pcolor(p.priority)}"
      title="${esc(tip)}">${esc(p.name)}</div>`;
  }).join('');

  return `<div class="tl-wrap">
    <div class="tl-labels">${labelHtml}</div>
    <div class="tl-track">${ruleHtml}${prefHtml}${blocksHtml}</div>
  </div>`;
}

function renderTimelineLegend(includePref) {
  const showPref = document.getElementById('o-pref').checked;
  const legendItems = ['critical','high','medium','low'].map(p =>
    `<span><span class="tl-swatch" style="background:${pcolor(p)}"></span>${p}</span>`).join('');
  const prefLegend = (includePref && showPref)
    ? `<span><span class="tl-swatch" style="background:#94a3b8;opacity:0.4"></span>preferred window</span>`
    : '';
  return `<div class="tl-legend">${legendItems}${prefLegend}</div>`;
}

/* ── Results card ──────────────────────────────────────── */
function resultsCard(s) {
  const showSkip = document.getElementById('o-skip').checked;
  const skipSet  = new Set([...s.skipped_optional, ...s.unplaced_required]);

  const placed = s.placements.map(p => `<tr>
    <td style="color:var(--muted)">${dt(p.start)} &ndash; ${tm(p.end)}</td>
    <td style="font-weight:500">${esc(p.name)}</td>
    <td>${dur(p.duration_minutes)}</td>
    <td><span class="badge ${p.priority}">${p.priority}</span></td>
    <td><span class="badge ${p.requirement}">${p.requirement}</span></td>
    <td style="font-variant-numeric:tabular-nums">${p.score.toFixed(1)}</td>
  </tr>`).join('');

  let skipped = '';
  if (showSkip && skipSet.size) {
    skipped = [...skipSet].sort().map(name => {
      const t = s.tasks.find(t => t.name === name);
      if (!t) return '';
      const isMissing = s.unplaced_required.includes(name);
      const rowCls = isMissing ? 'row-missing' : 'row-skip';
      const note   = isMissing
        ? `<span style="color:var(--red);font-weight:600">&#10007; unplaced (required)</span>`
        : `<span style="color:var(--muted)">skipped (optional)</span>`;
      return `<tr class="${rowCls}">
        <td>${note}</td>
        <td>${esc(t.name)}</td>
        <td>${dur(t.duration_minutes)}</td>
        <td><span class="badge ${t.priority}">${t.priority}</span></td>
        <td><span class="badge ${t.requirement}">${t.requirement}</span></td>
        <td>—</td>
      </tr>`;
    }).join('');
  }

  return `<div class="card">
    <div class="card-title">Schedule (${s.placed_count} placed)</div>
    <table class="tbl">
      <thead><tr>
        <th>Time</th><th>Task</th><th>Duration</th><th>Priority</th><th>Requirement</th><th>Score</th>
      </tr></thead>
      <tbody>${placed}${skipped}</tbody>
    </table>
  </div>`;
}

/* ── Diff table (compare) ──────────────────────────────── */
function diffTableCard(c, h) {
  const rows = [];
  for (const t of c.tasks) {
    const cp = c.placements.find(x => x.name === t.name);
    const hp = h.placements.find(x => x.name === t.name);
    if (!placementDiffers(cp, hp)) continue;

    const scoreC = cp ? cp.score : 0;
    const scoreH = hp ? hp.score : 0;
    const delta  = scoreC - scoreH;
    const deltaCls = Math.abs(delta) < 0.05 ? 'delta-same'
                   : delta > 0              ? 'delta-better'
                   :                          'delta-worse';
    const deltaStr = delta === 0 ? '—' : (delta > 0 ? '+' : '') + delta.toFixed(1);

    rows.push(`<tr>
      <td style="font-weight:500">${esc(t.name)}</td>
      <td><span class="badge ${t.priority}">${t.priority}</span></td>
      <td><span class="badge ${t.requirement}">${t.requirement}</span></td>
      <td>${cp ? `<span style="color:var(--cpsat)">${tm(cp.start)}</span>` : `<span style="color:var(--muted)">—</span>`}</td>
      <td>${hp ? `<span style="color:var(--heuristic)">${tm(hp.start)}</span>` : `<span style="color:var(--muted)">—</span>`}</td>
      <td style="font-variant-numeric:tabular-nums">${cp ? scoreC.toFixed(1) : '—'}</td>
      <td style="font-variant-numeric:tabular-nums">${hp ? scoreH.toFixed(1) : '—'}</td>
      <td class="${deltaCls}" style="font-variant-numeric:tabular-nums;font-weight:600">${deltaStr}</td>
    </tr>`);
  }

  if (!rows.length) {
    return `<div class="card">
      <div class="card-title">Differences</div>
      <div style="color:var(--muted);font-size:12px;padding:6px 0">
        The two schedulers agreed on every placement.
      </div>
    </div>`;
  }

  return `<div class="card">
    <div class="card-title">Differences (${rows.length})</div>
    <table class="tbl">
      <thead><tr>
        <th>Task</th><th>Priority</th><th>Req</th>
        <th style="color:var(--cpsat)">CP-SAT time</th>
        <th style="color:var(--heuristic)">Greedy time</th>
        <th style="color:var(--cpsat)">CP-SAT score</th>
        <th style="color:var(--heuristic)">Greedy score</th>
        <th>Δ (CP − G)</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
  </div>`;
}

/* ── Stats card (single) ───────────────────────────────── */
function statsCard(s) {
  const req       = s.tasks.filter(t => t.requirement === 'required').length;
  const reqPlaced = req - s.unplaced_required.length;
  const timeStr   = s.elapsed_ms < 1000
    ? s.elapsed_ms.toFixed(0) + 'ms'
    : (s.elapsed_ms / 1000).toFixed(2) + 's';

  const statusColor = s.solver_status === 'OPTIMAL'
    ? 'var(--green)'
    : s.solver_status?.startsWith('FEASIBLE')
      ? 'var(--yellow)'
      : s.solver_status === 'INFEASIBLE'
        ? 'var(--red)'
        : s.solver_status === 'GREEDY_OK'
          ? 'var(--green)'
          : s.solver_status?.startsWith('GREEDY')
            ? 'var(--yellow)'
            : 'var(--muted)';

  return `<div class="card">
    <div class="card-title">Stats</div>
    <div class="stats-row">
      <div class="stat-box"><div class="sv">${s.placed_count}/${s.total_count}</div><div class="sl">Tasks placed</div></div>
      <div class="stat-box"><div class="sv">${reqPlaced}/${req}</div><div class="sl">Required placed</div></div>
      <div class="stat-box"><div class="sv">${s.total_score.toFixed(1)}</div><div class="sl">Total score</div></div>
      <div class="stat-box"><div class="sv">${timeStr}</div><div class="sl">Solve time</div></div>
      <div class="stat-box"><div class="sv" style="font-size:13px;color:${statusColor}">${s.solver_status || '—'}</div><div class="sl">Status</div></div>
    </div>
  </div>`;
}

/* ── Stats card (compare) ──────────────────────────────── */
function compareStatsCard(c, h) {
  const timeStr = (ms) => ms < 1000 ? ms.toFixed(0) + 'ms' : (ms / 1000).toFixed(2) + 's';
  const reqTotal = c.tasks.filter(t => t.requirement === 'required').length;
  const cReqPlaced = reqTotal - c.unplaced_required.length;
  const hReqPlaced = reqTotal - h.unplaced_required.length;

  const deltaPlaced = c.placed_count - h.placed_count;
  const deltaScore  = c.total_score  - h.total_score;
  const deltaTime   = c.elapsed_ms   - h.elapsed_ms;

  const fmtDelta = (d, sign='') => {
    const cls = Math.abs(d) < 0.05 ? 'delta-same' : d > 0 ? 'delta-better' : 'delta-worse';
    const val = d === 0 ? '—' : (d > 0 ? '+' : '') + (Number.isInteger(d) ? d : d.toFixed(1)) + sign;
    return `<span class="${cls}" style="font-weight:600">${val}</span>`;
  };
  const fmtTimeDelta = (d) => {
    // Faster = better for the slower one. Show raw ratio if big.
    const cls = Math.abs(d) < 1 ? 'delta-same' : 'delta-worse';
    if (d === 0) return '<span class="delta-same">—</span>';
    const val = d > 0 ? `+${timeStr(d)} slower` : `${timeStr(-d)} faster`;
    return `<span class="${cls}" style="font-weight:600">${val}</span>`;
  };

  return `<div class="card">
    <div class="card-title">Comparison</div>
    <div class="cmp-stats">
      <div class="cmp-col cpsat">
        <div class="cmp-col-title">CP-SAT</div>
        <div class="cmp-row"><span class="cmp-k">Placed</span><span class="cmp-v">${c.placed_count}/${c.total_count}</span></div>
        <div class="cmp-row"><span class="cmp-k">Required placed</span><span class="cmp-v">${cReqPlaced}/${reqTotal}</span></div>
        <div class="cmp-row"><span class="cmp-k">Total score</span><span class="cmp-v">${c.total_score.toFixed(1)}</span></div>
        <div class="cmp-row"><span class="cmp-k">Solve time</span><span class="cmp-v">${timeStr(c.elapsed_ms)}</span></div>
        <div class="cmp-row"><span class="cmp-k">Status</span><span class="cmp-v" style="font-size:11px">${esc(c.solver_status || '—')}</span></div>
      </div>
      <div class="cmp-vs">vs</div>
      <div class="cmp-col heuristic">
        <div class="cmp-col-title">Greedy</div>
        <div class="cmp-row"><span class="cmp-k">Placed</span><span class="cmp-v">${h.placed_count}/${h.total_count}</span></div>
        <div class="cmp-row"><span class="cmp-k">Required placed</span><span class="cmp-v">${hReqPlaced}/${reqTotal}</span></div>
        <div class="cmp-row"><span class="cmp-k">Total score</span><span class="cmp-v">${h.total_score.toFixed(1)}</span></div>
        <div class="cmp-row"><span class="cmp-k">Solve time</span><span class="cmp-v">${timeStr(h.elapsed_ms)}</span></div>
        <div class="cmp-row"><span class="cmp-k">Status</span><span class="cmp-v" style="font-size:11px">${esc(h.solver_status || '—')}</span></div>
      </div>
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:24px;font-size:12px;flex-wrap:wrap">
      <div><span style="color:var(--muted)">Placed Δ:</span> ${fmtDelta(deltaPlaced)}</div>
      <div><span style="color:var(--muted)">Score Δ:</span> ${fmtDelta(deltaScore)}</div>
      <div><span style="color:var(--muted)">Time:</span> CP-SAT is ${fmtTimeDelta(deltaTime)}</div>
    </div>
  </div>`;
}

/* ── Utilities ─────────────────────────────────────────── */
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function dur(minutes) {
  if (minutes < 60) return minutes + 'm';
  const h = Math.floor(minutes / 60), m = minutes % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
}

function dt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit', hour12: true,
  });
}

function tm(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function pcolor(p) {
  return { critical: '#dc2626', high: '#ea580c', medium: '#2563eb', low: '#64748b' }[p] || '#64748b';
}
